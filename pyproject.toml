[project]
name = "jobpipe"
version = "0.1.0"
description = "Semi-autonomous investigator / loss-prevention job discovery and application pipeline for Calgary, AB"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    # Phase 2. Needs a version with structured-outputs support (output_config.format).
    "anthropic>=0.69",
    # Phase 4. No jinja2 — the dashboard is a static page plus a JSON API.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Phase 5 (submit.py).
submit = ["playwright>=1.48"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpipe"]
artifacts = ["jobpipe/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
