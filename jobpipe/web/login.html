<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>jobpipe</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#2a3441;--ink:#e6edf3;--dim:#8b98a5;--accent:#4a9eff;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:340px}
h1{margin:0 0 4px;font-size:20px;letter-spacing:-.3px}
p{margin:0 0 20px;color:var(--dim);font-size:12.5px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
input{width:100%;background:#0e1116;border:1px solid var(--line);color:var(--ink);border-radius:6px;
  padding:9px 11px;font:inherit}
input:focus{outline:none;border-color:var(--accent)}
button{width:100%;margin-top:14px;background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:10px;font:600 14px inherit;cursor:pointer}
.err{color:var(--bad);font-size:12.5px;margin-top:12px;min-height:1em}
.note{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:#6b7683;font-size:11.5px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>jobpipe</h1>
  <p>Private job pipeline &middot; localhost only</p>
  <label for="pw">Passphrase</label>
  <input id="pw" type="password" autofocus autocomplete="current-password">
  <button type="submit">Unlock</button>
  <div class="err" id="e"></div>
  <div class="note">Your resume and drafts never leave this machine.
    Set the passphrase with <code>JOBPIPE_PASSPHRASE</code> in <code>.env</code>.</div>
</form>
<script>
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const r = await fetch('/api/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({passphrase: document.getElementById('pw').value})
  });
  if(r.ok){ location.href = '/'; }
  else {
    document.getElementById('e').textContent = 'Incorrect passphrase.';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
};
</script>
</body>
</html>
